{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Board{% endblock %}</title>
    <!-- Bootstrap CSS for grid system -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Illinois Theme CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'tasks/css/style.css' %}">
    <!-- Plotly.js for interactive charts -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="{% url 'task_board' %}">
                    <i class="fas fa-tasks"></i> Task Board
                </a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'task_board' %}">Board (FBV)</a>
                    <a class="nav-link" href="{% url 'task_list_cbv' %}">Tasks (CBV)</a>
                    <a class="nav-link" href="{% url 'task_stats_cbv' %}">Statistics</a>
                    <a class="nav-link" href="{% url 'charts_dashboard' %}">📊 Charts</a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-4">
            {% block content %}
            <!-- Page content goes here -->
            {% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/your-kit-id.js" crossorigin="anonymous"></script>
</body>
</html>
